<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Emprendedor - Gestión Institucional</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Navbar Superior Institucional -->
    <nav class="bg-blue-900 text-white shadow-md mb-8">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Gestión Institucional</h1>
            
            <div class="flex items-center space-x-4">
                <!-- Botón para volver al listado principal -->
                <a href="/dashboard" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition duration-200">
                    Volver al Listado de Emprendedores
                </a>

                <span class="text-sm bg-blue-800 px-3 py-1.5 rounded-lg">
                    Usuario: <strong class="text-blue-200">{{ user }}</strong>
                </span>
                <a href="/logout" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition duration-200">
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Formulario -->
    <main class="max-w-3xl mx-auto px-6 py-8">
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Registrar Nuevo Emprendedor</h2>

            <!-- Formulario de Registro que apunta a la ruta POST /agregar -->
            <form action="/agregar" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Cédula -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Cédula</label>
                    <input type="text" name="cedula" required 
                           class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Nombre -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                    <input type="text" name="nombre" required 
                           class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Apellido -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Apellido</label>
                    <input type="text" name="apellido" required 
                           class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
                    <input type="text" name="telefono" required 
                           class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Nombre del Emprendimiento -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Emprendimiento</label>
                    <input type="text" name="nombre_emprendimiento" required 
                           class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Nacionalidad -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nacionalidad</label>
                    <select name="nacionalidad" required 
                            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">Seleccione una nacionalidad...</option>
                        <option value="Venezolano">Venezolano</option>
                        <option value="Extranjero">Extranjero</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Comuna</label>
                    <select name="comuna" required 
                            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">Seleccione una comuna...</option>
                        <option value="Guerreros en Batalla">Guerreros en Batalla</option>
                        <option value="Todos con Dios">Todos con Dios</option>
                        <option value="Forjadores de la Libertad">Forjadores de la Libertad</option>
                    </select>
                </div>

                <!-- Sector -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Sector</label>
                    <select name="sector" required 
                            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">Seleccione su sector...</option>
                        <option value="Fray Fernando Jimenez">Fray Fernando Jimenez</option>
                        <option value="La Capilla">La Capilla</option>
                        <option value="Alto Apure">Alto Apure</option>
                        <option value="Casco Central">Casco Central</option>
                        <option value="Viento Fresco">Viento Fresco</option>
                        <option value="El Bolsillo">El Bolsillo</option>
                        <option value="23 de Enero">23 de Enero</option>
                        <option value="Candelaria">Candelaria</option>
                        <option value="Valle Lindo">Valle Lindo</option>
                    </select>
                </div>

                <!-- Rubro o Actividad Económica -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Rubro/Actividad Económica</label>
                    <select name="rubro" required 
                            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">Seleccione un sector...</option>
                        <option value="Tecnología">Tecnología e Innovación</option>
                        <option value="Comercio">Comercio y Ventas</option>
                        <option value="Alimentos">Alimentos y Gastronomía</option>
                        <option value="Textil">Textil y Confección</option>
                        <option value="Servicios">Servicios Profesionales</option>
                    </select>
                </div>

<!-- Fecha de Emisión (Oculta por defecto con la clase 'hidden') -->
            <div id="contenedor-fecha" class="hidden">
                <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Emisión de Certificado</label>
                <input type="date" name="fecha_emision" 
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

<!-- Checkbox de Certificado -->
            <div class="md:col-span-2 flex items-center space-x-2 mt-2">
                <input type="checkbox" name="tiene_certificado" value="true" id="tiene_certificado" 
                    onchange="toggleFecha()"
                    class="w-4 h-4 text-blue-600 border-slate-300 rounded">
                <label for="tiene_certificado" class="text-sm font-medium text-slate-700">¿Posee certificado institucional?</label>
            </div>

                <!-- Botón de Guardar -->
                <div class="md:col-span-2">
                    <button type="submit" 
                            class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                        Guardar Emprendedor
                    </button>
                </div>
            </form>
        </div>
    </main>
<script>
    function toggleFecha() {
        const checkbox = document.getElementById('tiene_certificado');
        const contenedorFecha = document.getElementById('contenedor-fecha');
        
        if (checkbox.checked) {
            contenedorFecha.classList.remove('hidden'); // Muestra el campo
        } else {
            contenedorFecha.classList.add('hidden');    // Oculta el campo
        }
    }
</script>
</body>
</html>
