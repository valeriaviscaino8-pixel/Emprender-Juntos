<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <!-- Contenedor de la Tarjeta del Login -->
    <div class="bg-white p-8 rounded-xl shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Acceso Institucional</h2>

        <!-- Bloque Jinja2 para mostrar mensajes de error desde app.py -->
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg text-sm mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Formulario POST hacia la ruta /login de FastAPI -->
        <form action="/login" method="POST" class="space-y-4">
            
            <!-- Campo de Usuario -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                <input type="text" name="username" required 
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Campo de Contraseña -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" 
                    class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-200">
                Ingresar al Sistema
            </button>
        </form>
        
    </div>

</body>
</html>
